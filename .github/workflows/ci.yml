name: CI
on:
  pull_request:
    branches:
      - '**'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test libraries
        run: |
          for dir in libraries/*/; do
            name=$(basename "$dir")
            if [ -f "${dir}build.gradle" ]; then
              echo "::group::Testing library: $name"
              ./gradlew -p libraries ":${name}:test" --no-daemon
              echo "::endgroup::"
            fi
          done

      - name: Test modules
        run: |
          for dir in modules/*/; do
            name=$(basename "$dir")
            if [ -f "${dir}build.gradle" ]; then
              echo "::group::Testing module: $name"
              ./gradlew ":modules:${name}:test" --no-daemon
              echo "::endgroup::"
            fi
          done
          
      - name: Test applications
        run: |
          for dir in applications/*/; do
            name=$(basename "$dir")
            if [ -f "${dir}build.gradle" ]; then
              echo "::group::Testing application: $name"
              ./gradlew ":applications:${name}:test" --no-daemon
              echo "::endgroup::"
            fi
          done

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: false
