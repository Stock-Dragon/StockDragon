spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockdragon}
spring.datasource.username=${DB_USERNAME:stockdragon}
spring.datasource.password=${DB_PASSWORD:stockdragon}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

stockdragon.security.jwt.secret=${JWT_SECRET}
stockdragon.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

financial-statements.openfigi.base-url=https://api.openfigi.com
financial-statements.openfigi.api-key=${OPENFIGI_API_KEY:}
financial-statements.sec.base-url=https://www.sec.gov
financial-statements.sec.user-agent=${SEC_USER_AGENT}
financial-statements.sec.data-base-url=https://data.sec.gov