plugins {
    id 'stockdragon.java-conventions'
    alias(libs.plugins.spring.boot)
}

dependencies {
    implementation libs.spring.boot.starter.web
    runtimeOnly libs.postgresql

    implementation platform(libs.spring.dotenv.bom)
    developmentOnly libs.springboot4.dotenv

    implementation project(':modules:auth')
    implementation project(':modules:analysis-technical')
    implementation project(':modules:analysis-fundamental')
    implementation project(':modules:analysis-sentiment')
}