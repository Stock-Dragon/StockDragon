plugins {
    id 'java'
    id 'io.spring.dependency-management'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def libsCatalog = extensions.getByType(VersionCatalogsExtension).named('libs')

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${libsCatalog.findVersion('springBoot').get()}"
    }
}

dependencies {
    implementation(libsCatalog.findLibrary('spring-context').get())

    compileOnly(libsCatalog.findLibrary('lombok').get())
    annotationProcessor(libsCatalog.findLibrary('lombok').get())

    testCompileOnly(libsCatalog.findLibrary('lombok').get())
    testAnnotationProcessor(libsCatalog.findLibrary('lombok').get())

    testImplementation(platform(libsCatalog.findLibrary('junit-bom').get()))
    testImplementation(libsCatalog.findLibrary('junit-jupiter').get())
    testRuntimeOnly(libsCatalog.findLibrary('junit-platform-launcher').get())

    testImplementation(libsCatalog.findLibrary('spring-boot-starter-test').get())
}

tasks.withType(Test) {
    useJUnitPlatform()
}