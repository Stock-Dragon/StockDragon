def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
def osFolder = isWindows ? 'windows' : 'linux'
def scriptExt = isWindows ? '.ps1' : '.sh'
def interpreterPath = isWindows ? 'powershell.exe' : '/bin/bash'
def interpreterOptions = isWindows ? '-ExecutionPolicy Bypass -File' : ''

def databaseConfigs = [
        'Database - Start DB'            : 'start-db',
        'Database - Start And Patch DB'  : 'start-and-patch-db',
        'Database - Reset DB'            : 'reset-db',
        'Database - Delete DB'           : 'delete-db',
]

// display name -> npm script from package.json
def frontendConfigs = [
        'Frontend - Start Dev Server'    : 'dev',
]
def frontendPackageJson = '$PROJECT_DIR$/applications/frontend-app/package.json'

def runConfigurationsDir = { file("${rootDir}/.idea/runConfigurations") }
def safeName = { String displayName -> displayName.replaceAll(/[^A-Za-z0-9]/, '_') }

def writeRunConfigurations = { Map<String, String> toGenerate ->
    def runDir = runConfigurationsDir()
    runDir.mkdirs()

    toGenerate.each { displayName, scriptBaseName ->
        def scriptPath = "\$PROJECT_DIR\$/tools/local/scripts/${osFolder}/${scriptBaseName}${scriptExt}"

        new File(runDir, "${safeName(displayName)}.xml").text = """<component name="ProjectRunConfigurationManager">
  <configuration default="false" name="${displayName}" type="ShConfigurationType">
    <option name="SCRIPT_TEXT" value="" />
    <option name="INDEPENDENT_SCRIPT_PATH" value="true" />
    <option name="SCRIPT_PATH" value="${scriptPath}" />
    <option name="SCRIPT_OPTIONS" value="" />
    <option name="INDEPENDENT_SCRIPT_WORKING_DIRECTORY" value="true" />
    <option name="SCRIPT_WORKING_DIRECTORY" value="\$PROJECT_DIR\$" />
    <option name="INDEPENDENT_INTERPRETER_PATH" value="true" />
    <option name="INTERPRETER_PATH" value="${interpreterPath}" />
    <option name="INTERPRETER_OPTIONS" value="${interpreterOptions}" />
    <option name="EXECUTE_IN_TERMINAL" value="true" />
    <option name="EXECUTE_SCRIPT_FILE" value="true" />
    <envs />
    <method v="2" />
  </configuration>
</component>
"""
    }

    println "Generated ${toGenerate.size()} run configurations (${osFolder}) in ${runDir}"
}

def writeNpmRunConfigurations = { Map<String, String> toGenerate ->
    def runDir = runConfigurationsDir()
    runDir.mkdirs()

    toGenerate.each { displayName, npmScript ->
        new File(runDir, "${safeName(displayName)}.xml").text = """<component name="ProjectRunConfigurationManager">
  <configuration default="false" name="${displayName}" type="js.build_tools.npm">
    <package-json value="${frontendPackageJson}" />
    <command value="run" />
    <scripts>
      <script value="${npmScript}" />
    </scripts>
    <node-interpreter value="project" />
    <envs />
    <method v="2" />
  </configuration>
</component>
"""
    }

    println "Generated ${toGenerate.size()} npm run configurations in ${runDir}"
}

def deleteRunConfigurations = { Map<String, String> toDelete ->
    def runDir = runConfigurationsDir()

    if (!runDir.exists()) {
        println "No run configurations directory found, nothing to delete."
        return
    }

    def deletedCount = 0
    toDelete.each { displayName, scriptBaseName ->
        def xmlFile = new File(runDir, "${safeName(displayName)}.xml")
        if (xmlFile.exists()) {
            xmlFile.delete()
            deletedCount++
        }
    }

    println "Deleted ${deletedCount} run configurations from ${runDir}"
}

tasks.register('generateDbRunConfigurations') {
    doLast { writeRunConfigurations(databaseConfigs) }
}

tasks.register('deleteDbRunConfigurations') {
    doLast { deleteRunConfigurations(databaseConfigs) }
}

tasks.register('generateFrontendRunConfigurations') {
    doLast { writeNpmRunConfigurations(frontendConfigs) }
}

tasks.register('deleteFrontendRunConfigurations') {
    doLast { deleteRunConfigurations(frontendConfigs) }
}
